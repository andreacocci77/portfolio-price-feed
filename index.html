<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Portfolio Price Feed</title>

<style>
body {
    font-family: system-ui, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f6f7f9;
    color: #222;
}

main {
    background: white;
    padding: 28px;
    border-radius: 14px;
    box-shadow: 0 2px 12px #0001;
}

h1 {
    margin-top: 0;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    text-align: left;
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.price {
    font-weight: 600;
}

.date {
    color: #666;
}

.status {
    margin-top: 20px;
    color: #666;
}
</style>

</head>

<body>

<main>

<h1>Portfolio Price Feed</h1>

<p>
Prezzi aggiornati automaticamente tramite GitHub Actions.
</p>

<table>

<thead>
<tr>
    <th>ISIN</th>
    <th>Strumento</th>
    <th>Prezzo</th>
    <th>Data</th>
</tr>
</thead>

<tbody id="list"></tbody>

</table>

<p id="updated" class="status"></p>

</main>

<script>

async function loadPortfolio() {

    const tbody = document.querySelector('#list');

    try {

        // Carica la lista degli strumenti
        const response = await fetch('isins.json');

        const items = await response.json();

        for (const x of items) {

            try {

                // Carica il JSON del singolo strumento
                const priceResponse =
                    await fetch(`prices/${x.isin}.json`);

                const data =
                    await priceResponse.json();

                // Ultima quotazione disponibile
                const quotes = data.quotes || [];

                const last =
                    quotes[quotes.length - 1];

                const tr =
                    document.createElement('tr');

                if (last) {

                    const price =
                        Number(last.close).toLocaleString(
                            'it-IT',
                            {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 5
                            }
                        );

                    const date =
                        new Date(last.date).toLocaleDateString(
                            'it-IT'
                        );

                    tr.innerHTML = `
                        <td>${x.isin}</td>
                        <td>${x.name || ''}</td>
                        <td class="price">${price}</td>
                        <td class="date">${date}</td>
                    `;

                } else {

                    tr.innerHTML = `
                        <td>${x.isin}</td>
                        <td>${x.name || ''}</td>
                        <td colspan="2">Nessun dato</td>
                    `;

                }

                tbody.appendChild(tr);

            } catch (error) {

                console.error(
                    `Errore caricando ${x.isin}:`,
                    error
                );

            }

        }

        document.querySelector('#updated').textContent =
            'Ultimo aggiornamento disponibile nei dati di ciascuno strumento.';

    } catch (error) {

        console.error(error);

        document.querySelector('#updated').textContent =
            'Errore nel caricamento dei dati.';

    }

}

loadPortfolio();

</script>

</body>
</html>
